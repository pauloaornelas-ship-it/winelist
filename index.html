<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dcebfc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Os Meus Vinhos">
  <title>Os Meus Vinhos</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button id="btn-back" class="icon-btn" aria-label="Voltar" hidden>&#8592;</button>
    <h1 id="title">Os Meus Vinhos</h1>
    <button id="btn-menu" class="icon-btn" aria-label="Mais opções">&#8942;</button>
  </header>

  <div id="menu" class="menu" hidden>
    <button data-action="export">Exportar cópia de segurança</button>
    <label class="menu-item">Importar cópia de segurança
      <input id="import-file" type="file" accept="application/json,.json" hidden>
    </label>
  </div>

  <main>
    <!-- LISTA -->
    <section id="view-list" class="view">
      <div class="toolbar">
        <input id="search" type="search" placeholder="Procurar nome, produtor, região, casta…" autocomplete="off">
        <div class="filters">
          <select id="filter-type" aria-label="Filtrar por tipo">
            <option value="">Todos os tipos</option>
          </select>
          <select id="sort" aria-label="Ordenar">
            <option value="date-desc">Mais recentes</option>
            <option value="rating-desc">Melhor avaliados</option>
            <option value="year-desc">Ano (mais novo)</option>
            <option value="year-asc">Ano (mais antigo)</option>
            <option value="name-asc">Nome (A–Z)</option>
          </select>
        </div>
        <p id="stats" class="stats"></p>
      </div>
      <ul id="wine-list" class="wine-list"></ul>
      <div id="empty" class="empty" hidden>
        <div class="empty-icon">🍷</div>
        <p>Ainda não registou nenhum vinho.</p>
        <p>Toque em <strong>＋ Adicionar</strong>, em baixo, para registar o primeiro.</p>
      </div>
      <div id="no-results" class="empty" hidden>
        <div class="empty-icon">🔍</div>
        <p>Nenhum vinho corresponde à pesquisa ou ao filtro.</p>
        <button type="button" id="btn-clear-filters" class="btn btn-secondary">Limpar pesquisa e filtros</button>
      </div>
    </section>

    <!-- DETALHE -->
    <section id="view-detail" class="view" hidden>
      <div id="detail-pager"></div>
      <div id="detail"></div>
    </section>

    <!-- FORMULÁRIO -->
    <section id="view-form" class="view" hidden>
      <div id="form-pager"></div>
      <form id="wine-form" novalidate>
        <div class="photo-picker">
          <img id="photo-preview" alt="" hidden>
          <div id="photo-placeholder" class="photo-placeholder">
            <span>📷</span>
            <span>Adicionar foto do rótulo</span>
          </div>
          <div class="photo-actions">
            <label class="btn">Tirar foto
              <input id="photo-camera" type="file" accept="image/*" capture="environment" hidden>
            </label>
            <label class="btn btn-secondary">Galeria
              <input id="photo-gallery" type="file" accept="image/*" hidden>
            </label>
            <button type="button" id="photo-remove" class="btn btn-ghost" hidden>Remover</button>
          </div>
        </div>

        <label>Nome do vinho *
          <input name="name" required autocomplete="off" placeholder="ex.: Quinta do Crasto Reserva">
        </label>

        <div class="form-group">
          <span id="rating-label">Avaliação</span>
          <div class="rating-row">
            <div class="rating-input" id="rating-input" role="radiogroup" aria-labelledby="rating-label"></div>
            <span id="rating-text" class="rating-text" aria-live="polite"></span>
          </div>
        </div>

        <div class="row">
          <label>Ano (colheita)
            <input name="year" type="number" inputmode="numeric" min="1900" max="2100" placeholder="ex.: 2019" aria-describedby="year-error">
            <span id="year-error" class="field-error" hidden></span>
          </label>
          <label>Tipo
            <select name="type"></select>
          </label>
        </div>

        <label>Produtor
          <input name="producer" autocomplete="off" list="dl-producer">
        </label>

        <div class="row">
          <label>Região
            <input name="region" autocomplete="off" list="dl-region" placeholder="ex.: Douro">
          </label>
          <label>País
            <input name="country" autocomplete="off" list="dl-country" placeholder="ex.: Portugal">
          </label>
        </div>

        <label>Castas
          <input name="grapes" autocomplete="off" placeholder="ex.: Touriga Nacional, Tinta Roriz">
        </label>

        <div class="row">
          <label>Preço (€)
            <input name="price" type="number" inputmode="decimal" step="0.01" min="0">
          </label>
          <label>Data em que provei
            <input name="date" type="date">
          </label>
        </div>

        <label>Onde comprar
          <input name="whereToBuy" autocomplete="off" list="dl-whereToBuy" placeholder="ex.: Garrafeira X, Continente, site do produtor">
        </label>

        <label>Notas de prova
          <textarea name="notes" rows="4" placeholder="Aroma, sabor, o que acompanhou…"></textarea>
        </label>

        <label class="checkbox">
          <input name="buyAgain" type="checkbox"> Voltaria a comprar
        </label>

        <div class="form-actions sticky">
          <button type="button" id="btn-cancel" class="btn btn-ghost">Cancelar</button>
          <button type="submit" class="btn">Guardar</button>
        </div>
      </form>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Navegação principal">
    <a href="#/" data-nav="list"><span aria-hidden="true">🍷</span>Vinhos</a>
    <a href="#/novo" data-nav="new" class="nav-add"><span aria-hidden="true">＋</span>Adicionar</a>
  </nav>

  <datalist id="dl-producer"></datalist>
  <datalist id="dl-whereToBuy"></datalist>
  <datalist id="dl-region"></datalist>
  <datalist id="dl-country"></datalist>

  <div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="Foto em ecrã inteiro" hidden>
    <img id="viewer-img" alt="">
    <button type="button" id="viewer-close" class="viewer-close" aria-label="Fechar foto">✕</button>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
